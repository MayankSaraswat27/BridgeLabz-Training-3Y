<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            border: 5px solid red;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
            margin: 0;
        }

        .box{
            border: 2px solid black;
            width: 290px;
            height: 520px;
            background-color: black;
        }

        .top-bar{
            display: flex;
            justify-content: space-between;
        }
        
        .screen{
            display: flex;
            justify-content: end;
            padding-top: 80px;
            font-size: 30px;
            color: white;
        }

        .buttons{
            display: flex;
            flex-wrap: wrap;
            margin: 3px;
        }

        .button{
            background-color: grey;
            border-radius: 50%;
            border: 1px solid;
            padding: 15px;
            margin: 2px;
            height: 35px;
            width: 35px;
            text-align: center;
            font-size: 25px;
        }

        #A{
            background-color: orange;
        }

        .modified-text, .modified-text2{
            font-size: 30px;
            color: white;
        }

        .modified-text3{
            font-size: 30px;
        }

    </style>
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="box">
        <div class="top-bar">
            <i class='bxr  bx-menu modified-text'  ></i> 
            <i class='bxr  bx-calculator modified-text2'  ></i> 
        </div>
        <hr>
        <div class="screen">0</div>
        <div class="buttons">
            <div class="button"><i class='bxr  bx-backspace modified-text3'></i> </div>
            <div class="button">AC</div>
            <div class="button">%</div>
            <div class="button" id="A">/</div>
            <div class="button">7</div>
            <div class="button">8</div>
            <div class="button">9</div>
            <div class="button" id="A">X</div>
            <div class="button">4</div>
            <div class="button">5</div>
            <div class="button">6</div>
            <div class="button" id="A">-</div>
            <div class="button">1</div>
            <div class="button">2</div>
            <div class="button">3</div>
            <div class="button" id="A">+</div>
            <div class="button">+/-</div>
            <div class="button">0</div>
            <div class="button">.</div>
            <div class="button" id="A">=</div>
        </div>
        
    </div>
</body>
</html>
